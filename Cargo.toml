[workspace]
members = [
  "crates/core", "crates/discovery", "crates/git", "crates/health", "crates/disk",
  "crates/search", "crates/storage", "crates/platform", "apps/cli"
]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/reposhelf"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
